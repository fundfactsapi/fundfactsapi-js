# Publishes @fundfactsapi/sdk to npm when a GitHub release is published (tag = version, e.g. v0.1.0).
# Requires an npm granular access token with publish rights stored as NPM_TOKEN,
# or npm Trusted Publishing configured for this repo (then the token is unnecessary).
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
